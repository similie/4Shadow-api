name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a change in NOAA's files shows up here before it shows up in production.
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff check --output-format=github .
      - name: Shell scripts
        run: shellcheck deploy/deploy.sh

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            forecast/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Unit and API tests on a small synthetic store: no network, no data.
      - run: pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t 4shadow-forecast .
      - name: Starts and answers with an empty store
        run: |
          docker run -d --name api -p 5003:5003 4shadow-forecast
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5003/v2 && break; sleep 1; done
          expect() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5003$2"); echo "$2 -> $code"; [ "$code" = "$1" ]; }
          expect 200 /v2
          expect 200 /v2/docs
          expect 200 /v2/gfs/variables
          expect 503 /v2/health                     # no run ingested yet
          expect 503 "/v2/forecast?lat=-8.55&lon=125.57"
          docker exec api python -c "import forecast.ingest, forecast.places"
      - if: failure()
        run: docker logs api

  end-to-end:
    name: End to end (real GFS data)
    # Downloads about 100 MB from NOAA's open data on AWS, so it runs on main, daily and by hand,
    # not on every pull request.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Keep the data outside the checkout
        run: |
          echo "FORECAST_DATA_ROOT=$RUNNER_TEMP/data/forecast" >> "$GITHUB_ENV"
          echo "FORECAST_PLACES_DB=$RUNNER_TEMP/data/places/places.sqlite" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ingest hours 0-6 of the newest GFS run
        run: python -m forecast.ingest --max-fhr 6
      - name: Build the small place index (GeoNames cities500)
        run: python -m forecast.places build
      - name: Start the API
        run: |
          nohup uvicorn forecast.api:app --port 5003 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5003/v2 && break; sleep 1; done
      - name: The deploy smoke tests
        run: PYTHON=python deploy/deploy.sh check
      - if: failure()
        run: cat "$RUNNER_TEMP/api.log"
